services:
  player-service:
    build: ./player-service
    ports:
      - "8081:8080"
  match-service:
    build: ./match-service
    environment:
      PLAYER_SERVICE_URL: http://player-service:8080
    ports:
      - "8082:8080"
    depends_on:
      - player-service
  lineup-service:
    build: ./lineup-service
    ports:
      - "8083:8080"
  ranking-service:
    build: ./ranking-service
    ports:
      - "8084:8080"

