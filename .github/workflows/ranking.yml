name: Ranking Service verification
on:
  push:
    branches: [feature/ranking-service]
    paths:
      - 'ranking-service/**'
      - '.github/workflows/ranking.yml'
  pull_request:
    paths:
      - 'ranking-service/**'
      - '.github/workflows/ranking.yml'
jobs:
  ranking-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ranking-service/pom.xml
      - name: Maven tests
        run: mvn -B test
        working-directory: ranking-service

