name: Full local-backup verification

on:
  push:
    branches: [feature/full-local-backup]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [player-service, match-service, availability-service, lineup-service, ranking-service, llm-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Maven tests
        run: mvn -B test
        working-directory: ${{ matrix.service }}
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start reference services
        run: docker compose up -d --build
      - name: Exercise end-to-end scenario
        run: python3 scripts/smoke.py
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down

